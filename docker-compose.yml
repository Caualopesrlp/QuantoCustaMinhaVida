services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qcmv_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qcmv_net

  web:
    image: nginx:alpine
    container_name: qcmv_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - qcmv_net

  db:
    image: postgres:16-alpine
    container_name: qcmv_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qcmv}
      POSTGRES_USER: ${DB_USERNAME:-qcmv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qcmv} -d ${DB_DATABASE:-qcmv}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qcmv_net

networks:
  qcmv_net:
    driver: bridge
